name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Forge
        run: |
          wget https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar

      - name: Install Forge
        run: |
          mkdir minecraft
          cd minecraft
          java -jar ../forge-1.20.1-47.4.23-installer.jar --installServer

      - name: Accept Minecraft EULA
        run: |
          cd minecraft
          echo "eula=true" > eula.txt

      - name: Show installed files
        run: |
          echo "=== Minecraft server files ==="
          ls -lah minecraft
          echo "=== Forge libraries ==="
          find minecraft/libraries -type f -name "*.jar" | head -30

      - name: Start Minecraft Server
        run: |
          cd minecraft
          chmod +x run.sh
          ./run.sh nogui
