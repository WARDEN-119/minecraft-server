name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Forge
        run: |
          wget https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar

      - name: Install Forge
        run: |
          mkdir minecraft
          cd minecraft
          java -jar ../forge-1.20.1-47.4.23-installer.jar --installServer

      - name: Accept Minecraft EULA
        run: |
          cd minecraft
          echo "eula=true" > eula.txt

      - name: Show installed files
        run: |
          echo "=== Minecraft server files ==="
          ls -lah minecraft
          echo "=== Forge libraries ==="
          find minecraft/libraries -type f -name "*.jar" | head -30

      - name: Download and start Playit tunnel agent
        env:
          SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          wget https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64 -O playit
          chmod +x ./playit
          nohup ./playit > playit.log 2>&1 &
          disown
          sleep 5
          echo "=== Playit agent log (first 5 seconds) ==="
          cat playit.log

      - name: Start Minecraft Server
        run: |
          cd minecraft
          chmod +x run.sh
          ./run.sh nogui
