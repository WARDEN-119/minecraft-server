name: Playit Claim
on: workflow_dispatch

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download playit agent
        run: |
          wget https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64 -O playit
          chmod +x ./playit

      - name: Run playit (watch this log for the claim link)
        run: ./playit
