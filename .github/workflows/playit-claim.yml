name: Playit Claim
on: workflow_dispatch

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download playit agent (legacy standalone version)
        run: |
          wget https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64 -O playit
          chmod +x ./playit

      - name: Run playit (watch this log for the claim link)
        env:
          RUST_LOG: debug
        run: timeout 90 stdbuf -oL -eL ./playit || echo "playit exited or timed out after 90s"

      - name: Print the secret key
        run: cat "$(./playit secret-path)"
